{# past_exp.html #}
{% for cv in past_exp %}
<div class="col">
    <div class="card h-100 border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title text-primary">{{cv.job_role}} at {{cv.company_name}}</h5>
            <p><strong>Responsibilities:</strong> {{cv.responsibilities}}</p>
            <p><strong>Achievements:</strong> {{cv.achievements}}</p>
            <p><strong>Challenges:</strong> {{cv.challenges}}</p>
        </div>
    </div>
</div>

{% endfor %}
