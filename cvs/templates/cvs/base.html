{# templates/base.html #}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>CVs Assistant - {% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light text-dark">
        <header class="bg-primary text-white py-4 mb-4 shadow-sm">
            <div class="container text-center">
                <h1 class="mb-0">{% block header %}{% endblock %}</h1>
            </div>
        </header>

        <main class="container mb-5">
            <!-- Navigation Bar -->
            <nav class="navbar navbar-expand-lg bg-transparent border-bottom mb-4">
                <div class="container">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link text-primary fw-semibold" href="/cvs/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-primary fw-semibold" href="/cvs/chat/">Chat</a>
                        </li>
                    </ul>
                </div>
            </nav>

            {% block content %}{% endblock %}
        </main>

        <footer class="bg-dark text-white text-center py-3 mt-auto">
            <p class="mb-0">&copy; 2025 CVS Repository</p>
        </footer>
    </body>
</html>
